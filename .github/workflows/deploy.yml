name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - main

env:
  # Registry/Repository As Required
  DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
  DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}

permissions:
  id-token: write
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          allow_issue_writing: false
          target: "https://secureapp.appsecops.dev/"
          cmd_options: "-x zap_app.xml"

      - name: Show files
        shell: bash
        run: |
          ls -l
          cat zap_app.xml

         
      - name: Upload ZAP XML to DefectDojo
        shell: bash
        run: |
          set -euo pipefail 
          test -s zap_app.xml || { echo "❌ Missing/empty ZAP XML"; ls -lah; exit 1; }

          BASE="${DEFECTDOJO_URL%/}"
          API="$BASE/api/v2"

          HTTP=$(curl -skS -o /tmp/dojo_zap.json -w "%{http_code}" \
            -X POST "$API/reimport-scan/" \
            -H "Authorization: Token $DEFECTDOJO_API_KEY" \
            -H "Accept: application/json" \
            -F "scan_type=ZAP Scan" \
            -F "product_name=ecommerceApp06" \
            -F "engagement_name=Continuous Testing" \
            -F "test_title=ZAP Baseline - App1" \
            -F "auto_create_context=true" \
            -F "scan_date=$(date -u +%F)" \
            -F "close_old_findings=true" \
            -F "file=@zap_app.xml"
          )

          echo "HTTP: $HTTP"
          cat /tmp/dojo_zap.json
          [[ "$HTTP" == 2* ]]

